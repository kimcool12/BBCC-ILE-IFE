<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BBCC</title>
    <meta name="description" content="We are a people of Love and Excellence: Result-oriented, Spirit-led, Word-rooted, Prayer-driven and Kingdom-conscious." />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Browser tab icon (favicon) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link preview when shared on WhatsApp, Facebook, X, etc.
         IMPORTANT: replace https://YOUR-DOMAIN.com with your real website address after you deploy.
         WhatsApp needs the full address (not just /og-image.jpg) to show the picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BBCC" />
    <meta property="og:title" content="BBCC" />
    <meta property="og:description" content="We are a people of Love and Excellence: Result-oriented, Spirit-led, Word-rooted, Prayer-driven and Kingdom-conscious." />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BBCC" />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
